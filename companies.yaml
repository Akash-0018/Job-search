# Company career boards read directly (free, no scraping, no login).
# Each company's "slug" is the part of its job-board URL:
#   greenhouse: boards.greenhouse.io/<slug>   or job-boards.greenhouse.io/<slug>
#   lever:      jobs.lever.co/<slug>
#   ashby:      jobs.ashbyhq.com/<slug>
#
# This is an UNVERIFIED starter list. Run:  python -m src.check_companies
# to see which slugs work, then delete the dead ones and add companies you want.
# Tip: open a company's careers page, click a job, and look at the URL.

greenhouse:
  - {name: Databricks, slug: databricks}
  - {name: MongoDB, slug: mongodb}
  - {name: Twilio, slug: twilio}
  - {name: Elastic, slug: elastic}
  - {name: GitLab, slug: gitlab}

lever:
  - {name: CRED, slug: cred}
  - {name: Meesho, slug: meesho}

ashby:
  - {name: Sarvam AI, slug: sarvam}
